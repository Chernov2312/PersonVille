{% extends "base.html" %}
{% load static %}

{% block title %}Главная страница{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/homepage.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-md-center">
        <div class="col-md-8 homepage-hero">
            <h1 class="homepage-title">Добро пожаловать в PersonVille!</h1>

            <a
                class="homepage-test-button"
                href="#"
                data-first-url="{% url 'quizzes:first' %}"
                data-restart-url="{% url 'quizzes:restart' %}"
                onclick="return handleTestStart(
                    {% if request.session.city_result %}true{% else %}false{% endif %},
                    this.dataset.firstUrl,
                    this.dataset.restartUrl
                )"
            >
                Пройти тест
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script src="{% static 'js/restart.js' %}"></script>
{% endblock script %}
