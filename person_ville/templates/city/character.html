{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>{{ character.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Source Sans 3", sans-serif;
            color: #2b241d;
            background:
                linear-gradient(rgba(14, 16, 24, 0.52), rgba(14, 16, 24, 0.68)),
                url("{% static 'images/city_main.jpg' %}") center center / cover no-repeat fixed;
        }

        .character-page {
            min-height: 100vh;
            padding: 24px 20px 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .character-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            z-index: 2;
            transition: opacity 0.45s ease;
        }

        .character-toolbar.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .character-toolbar-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 12px 22px;
            border: 2px solid #d8c493;
            border-radius: 16px;
            background: rgba(79, 97, 143, 0.94);
            color: #f5f1e8;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
        }

        .character-toolbar-button:hover {
            color: #fff;
            text-decoration: none;
            box-shadow:
                0 0 0 3px rgba(216, 196, 147, 0.28),
                0 0 22px rgba(130, 144, 218, 0.42),
                0 4px 0 rgba(0, 0, 0, 0.22);
        }

        .character-export-wrap {
            width: min(1500px, 98vw);
            display: flex;
            justify-content: center;
        }

        .character-card-shell {
            width: 1500px;
            min-height: 1320px;
            position: relative;
            padding: 86px 100px 70px;
        }

        .character-card-shell > * {
            position: relative;
            z-index: 1;
        }

        .character-card-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("{% static 'images/Character.png' %}");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            transform: translateY(-190px);
            z-index: 0;
        }

        .character-card-shell::before {
            background-size: 136% 126%;
        }

        .character-card-header {
            margin-bottom: 26px;
        }

        .character-card-title {
            margin: 0;
            font-family: "Cormorant Garamond", serif;
            font-size: 60px;
            line-height: 1.05;
            font-weight: 700;
            color: #2b241d;
            text-align: center;
        }

        .character-card-date {
            margin-top: 10px;
            text-align: center;
            font-size: 20px;
            line-height: 1.2;
            color: #5b4a37;
            font-weight: 700;
        }

        .character-card-grid {
            display: block;
        }

        .character-content {
            display: flex;
            flex-direction: column;
            gap: 9px;
            width: 100%;
            max-width: 100%;
        }

        .character-trait-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
        }

        .character-trait-item {
            padding: 10px 0 14px;
            border-bottom: 1px solid rgba(91, 74, 55, 0.16);
            font-size: 20px;
            line-height: 1.6;
            font-weight: 700;
            color: #16100b;

            white-space: normal;
            max-width: 100%;
        }

        .character-summary-box {
            width: 96%;
            margin-top: 16px;
            padding: 20px 24px;
            border-radius: 18px;
            background: #e4c894;
            border: 1px solid rgba(91, 74, 55, 0.12);
            transform: translateX(47px);
            transform: translateY(-29px);
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .character-summary-title {
            margin: 0 0 10px;
            font-family: "Cormorant Garamond", serif;
            font-size: 34px;
            line-height: 1.1;
            font-weight: 700;
            color: #2b241d;
        }

        .character-summary-text {
            margin: 0;
            font-size: 24px;
            line-height: 1.52;
            font-weight: 600;
            color: #322920;
        }

        @media (max-width: 1450px) {
            .character-card-shell {
                width: min(96vw, 1280px);
                min-height: 960px;
                padding: 72px 70px 58px;
            }

            .character-card-title {
                font-size: 46px;
            }

            .character-trait-item {
                font-size: 18px;
            }

            .character-summary-text {
                font-size: 21px;
            }
        }

        @media (max-width: 1100px) {
            .character-card-shell {
                width: min(98vw, 1100px);
                min-height: auto;
                padding: 58px 34px 46px;
            }

            .character-card-title {
                font-size: 38px;
            }

            .character-card-date {
                font-size: 16px;
            }

            .character-trait-item {
                font-size: 17px;
            }

            .character-summary-title {
                font-size: 28px;
            }

            .character-summary-text {
                font-size: 18px;
            }

            .character-summary-box {
                transform: none;
            }
        }
    </style>
</head>
<body>
<div class="character-page">
    <div class="character-toolbar" id="characterToolbar">
        <button
            type="button"
            class="character-toolbar-button"
            onclick="downloadCharacterCard()"
        >
            Скачать карточку
        </button>

        <a
            href="{% url 'city:city' %}"
            class="character-toolbar-button"
        >
            Вернуться в город
        </a>
    </div>

    <div class="character-export-wrap">
        <div class="character-card-shell" id="characterCardExport">
            <div class="character-card-header">
                <h1 class="character-card-title">{{ character.title }}</h1>
                <div
                    class="character-card-date"
                    id="characterDate"
                    data-server-date="{{ character.server_created_at }}"
                >
                    {{ character.server_created_at }}
                </div>
            </div>

            <div class="character-card-grid">
                <div class="character-content">
                    <div class="character-trait-list">
                        {% for item in character.trait_allegories %}
                            <div class="character-trait-item">
                                {{ item.text }}
                            </div>
                        {% endfor %}
                    </div>

                    <div class="character-summary-box">
                        <h2 class="character-summary-title">
                            Итог PersonVille
                        </h2>
                        <p class="character-summary-text">
                            {{ character.city_summary }}
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function formatClientDate(dateObj) {
        const day = String(dateObj.getDate()).padStart(2, '0');
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const year = dateObj.getFullYear();
        return `${day}.${month}.${year}`;
    }

    (function applyClientDateIfAvailable() {
        const dateNode = document.getElementById('characterDate');
        if (!dateNode) return;

        try {
            const clientDate = new Date();
            if (!isNaN(clientDate.getTime())) {
                dateNode.textContent = formatClientDate(clientDate);
            }
        } catch (error) {
            dateNode.textContent = dateNode.dataset.serverDate || '';
        }
    })();

    async function downloadCharacterCard() {
        const toolbar = document.getElementById('characterToolbar');
        const card = document.getElementById('characterCardExport');

        if (!card || !window.html2canvas) {
            alert('Не удалось подготовить карточку к скачиванию.');
            return;
        }

        toolbar.classList.add('is-hidden');

        await new Promise(resolve => requestAnimationFrame(resolve));

        try {
            const rect = card.getBoundingClientRect();

            const canvas = await html2canvas(card, {
                backgroundColor: null,
                scale: 2,
                useCORS: true,
                logging: false,
                x: 0,
                y: 0,
                width: Math.ceil(rect.width),
                height: Math.ceil(rect.height),
                scrollX: 0,
                scrollY: 0,
                windowWidth: Math.ceil(rect.width),
                windowHeight: Math.ceil(rect.height)
            });

            const link = document.createElement('a');
            link.download = 'personville_result.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (error) {
            alert('Не удалось скачать карточку.');
        } finally {
            toolbar.classList.remove('is-hidden');
        }
    }
</script>
</body>
</html>
